<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="f1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b" />
      <feBlend in="SourceGraphic" in2="b" mode="normal" />
    </filter>
  </defs>

  <!-- soft blurred background circle -->
  <circle cx="256" cy="256" r="210" fill="url(#g1)" opacity="0.9" filter="url(#f1)" />

  <!-- white inner ring -->
  <circle cx="256" cy="256" r="160" fill="#0b0f19" opacity="0.28" />

  <!-- Initials -->
  <text x="50%" y="54%" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="160" fill="white">SRK</text>

  <!-- small check badge -->
  <g transform="translate(360,360) scale(0.18)">
    <circle cx="80" cy="80" r="80" fill="#06b6d4" />
    <path d="M56 80 L72 96 L104 64" stroke="#fff" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
